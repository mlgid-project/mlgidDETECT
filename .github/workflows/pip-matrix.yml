# Installs the package with pip on every supported Python version and checks
# that the right onnxruntime-gpu lands (the pin is split by python_version
# markers in pyproject.toml), that every submodule imports, and that ONNX
# Runtime actually executes a model on the CPU. Complements python-package.yml,
# which tests the conda environments (those are pinned to one Python).

name: pip install matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pip-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Check onnxruntime-gpu pin matches this Python
      run: |
        python - <<'EOF'
        import sys
        from importlib.metadata import version
        expected = ('1.26.0' if sys.version_info >= (3, 11)
                    else '1.23.2' if sys.version_info >= (3, 10)
                    else '1.19.2')
        got = version('onnxruntime-gpu')
        assert got == expected, f'onnxruntime-gpu {got}, expected {expected}'
        print('onnxruntime-gpu', got, 'OK')
        EOF

    - name: Import package and all submodules
      run: |
        python - <<'EOF'
        import importlib, pkgutil
        import mlgiddetect
        failed = []
        for info in pkgutil.walk_packages(mlgiddetect.__path__, 'mlgiddetect.'):
            try:
                importlib.import_module(info.name)
            except Exception as e:
                failed.append((info.name, f'{type(e).__name__}: {e}'))
        for name, err in failed:
            print(name, err)
        assert not failed, f'{len(failed)} submodule(s) failed to import'
        import onnxruntime as rt
        print('providers:', rt.get_available_providers())
        EOF

    # The runner has no GPU, so this exercises the exact scenario that segfaulted
    # mlgidBASE's CI with mlgiddetect 0.2.7: onnxruntime-gpu wheel installed,
    # Inference() left to pick the provider itself, real models, real images.
    - name: Run test suite (full detection pipeline)
      run: |
        pip install pytest
        pytest tests -v

    - name: CPU inference on a minimal model
      run: |
        pip install onnx
        python - <<'EOF'
        import numpy as np, onnx, onnxruntime as rt
        from onnx import helper, TensorProto
        X = helper.make_tensor_value_info('X', TensorProto.FLOAT, [2, 2])
        Y = helper.make_tensor_value_info('Y', TensorProto.FLOAT, [2, 2])
        g = helper.make_graph([helper.make_node('Add', ['X', 'X'], ['Y'])], 'g', [X], [Y])
        m = helper.make_model(g, opset_imports=[helper.make_opsetid('', 17)])
        # Recent onnx defaults to IR version 12, which ORT 1.19.2 (the 3.9 pin)
        # rejects; IR 8 is accepted by every pinned runtime.
        m.ir_version = 8
        sess = rt.InferenceSession(m.SerializeToString(), providers=['CPUExecutionProvider'])
        out = sess.run(None, {'X': np.ones((2, 2), np.float32)})[0]
        assert (out == 2).all()
        print('CPU inference OK on onnxruntime', rt.__version__)
        EOF
