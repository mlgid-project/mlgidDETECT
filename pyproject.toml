[project]
name = "mlgiddetect"
version = "0.2.6"
description = "Inference package for GIWAXS peak detection."
authors = [{ name = "Constantin Völter", email = "constantin.voelter@gmail.com" }, { name = "Nico Lerch", email = "nico.lerch@uni-tuebingen.de" }]
license = { text = "MIT" }
# Floor set by onnxruntime-gpu 1.26.0 (no wheels below 3.11).
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "appdirs",
    "h5py",
    "matplotlib",
    "numpy",
    "pandas",
    "pyyaml",
    "scipy",
    "tifffile",
    "torch",
    "torchvision",
    "onnxruntime-gpu==1.26.0",
    "opencv-python"
]

[tool.setuptools.packages.find]
include = ["mlgiddetect*"]


[project.scripts]
mlgiddetect = "mlgiddetect.main:main"

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"
