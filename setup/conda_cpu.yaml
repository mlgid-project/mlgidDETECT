name: mlgiddetect-cpu
channels:
  - pytorch
  - conda-forge
dependencies:
  - cpuonly
  # 3.12 floor comes from onnxruntime-gpu 1.26.0 (>=3.11, and 3.12 is
  # the newest python the pytorch=2.5.1 conda builds cover).
  - python=3.12
  - pip
  - pytorch=2.5.1
  - torchvision=0.20.1

  - pip:
    - -e ../