name: mlgiddetect-gpu
channels:
  - conda-forge
  - nvidia/label/cuda-12.9.1
dependencies:
  - python=3.12
  - numpy<2
  - pip
  # NOTE: no conda `onnxruntime` here: the pip install of this
  # package brings onnxruntime-gpu==1.26.0, and the conda-forge
  # onnxruntime is the CPU build shipping the SAME python module,
  # so co-installing clobbers the GPU one.
  - pytorch
  - torchvision
  - ffmpeg=4.3.2
  - cudnn=8.8.0.121
  - numpy<2
  - libcudnn
  - libstdcxx-ng
  - cuda-runtime
  - cupy

  - pip:
    - -e ../